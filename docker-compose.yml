services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragscope
      POSTGRES_USER: ragscope
      POSTGRES_PASSWORD: ragscope
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragscope -d ragscope"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        RAGSCOPE_INSTALL_RERANKER: ${RAGSCOPE_INSTALL_RERANKER:-false}
    environment:
      RAGSCOPE_ENVIRONMENT: ${RAGSCOPE_ENVIRONMENT:-development}
      RAGSCOPE_DATABASE_URL: ${RAGSCOPE_DATABASE_URL:-postgresql+psycopg://ragscope:ragscope@db:5432/ragscope}
      RAGSCOPE_ARTIFACT_ROOT: ${RAGSCOPE_ARTIFACT_ROOT:-/var/lib/ragscope/artifacts}
      RAGSCOPE_MAX_UPLOAD_BYTES: ${RAGSCOPE_MAX_UPLOAD_BYTES:-52428800}
      RAGSCOPE_CORS_ORIGINS: ${RAGSCOPE_CORS_ORIGINS:-http://localhost:3000}
      RAGSCOPE_EMBEDDING_PROVIDER: ${RAGSCOPE_EMBEDDING_PROVIDER:-fake}
      RAGSCOPE_EMBEDDING_MODEL: ${RAGSCOPE_EMBEDDING_MODEL:-fake-hash-embedding-v1}
      RAGSCOPE_EMBEDDING_DIMENSION: ${RAGSCOPE_EMBEDDING_DIMENSION:-64}
      RAGSCOPE_EMBEDDING_TIMEOUT_SECONDS: ${RAGSCOPE_EMBEDDING_TIMEOUT_SECONDS:-60}
      RAGSCOPE_GENERATION_PROVIDER: ${RAGSCOPE_GENERATION_PROVIDER:-fake}
      RAGSCOPE_GENERATION_MODEL: ${RAGSCOPE_GENERATION_MODEL:-fake-generation-v1}
      RAGSCOPE_GENERATION_BASE_URL: ${RAGSCOPE_GENERATION_BASE_URL:-https://api.openai.com/v1}
      RAGSCOPE_GENERATION_API_KEY: ${RAGSCOPE_GENERATION_API_KEY:-}
      RAGSCOPE_GENERATION_TIMEOUT_SECONDS: ${RAGSCOPE_GENERATION_TIMEOUT_SECONDS:-60}
      RAGSCOPE_GENERATION_INPUT_PRICE_PER_MILLION: ${RAGSCOPE_GENERATION_INPUT_PRICE_PER_MILLION:-}
      RAGSCOPE_GENERATION_OUTPUT_PRICE_PER_MILLION: ${RAGSCOPE_GENERATION_OUTPUT_PRICE_PER_MILLION:-}
      RAGSCOPE_EMBEDDING_INPUT_PRICE_PER_MILLION: ${RAGSCOPE_EMBEDDING_INPUT_PRICE_PER_MILLION:-}
      RAGSCOPE_EXPERIMENT_COST_LIMIT: ${RAGSCOPE_EXPERIMENT_COST_LIMIT:-}
      RAGSCOPE_GEMINI_API_KEY: ${RAGSCOPE_GEMINI_API_KEY:-}
      RAGSCOPE_GEMINI_BASE_URL: ${RAGSCOPE_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      RAGSCOPE_GEMINI_MODEL: ${RAGSCOPE_GEMINI_MODEL:-gemini-2.5-flash}
      RAGSCOPE_GEMINI_EMBEDDING_MODEL: ${RAGSCOPE_GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      RAGSCOPE_GEMINI_EMBEDDING_DIMENSION: ${RAGSCOPE_GEMINI_EMBEDDING_DIMENSION:-768}
      RAGSCOPE_GEMINI_EMBEDDING_BATCH_SIZE: ${RAGSCOPE_GEMINI_EMBEDDING_BATCH_SIZE:-100}
      RAGSCOPE_GEMINI_EMBEDDING_TASK_TYPE: ${RAGSCOPE_GEMINI_EMBEDDING_TASK_TYPE:-SEMANTIC_SIMILARITY}
      RAGSCOPE_WORKER_LEASE_SECONDS: ${RAGSCOPE_WORKER_LEASE_SECONDS:-600}
    ports:
      - "8000:8000"
    volumes:
      - artifact-data:/var/lib/ragscope/artifacts
      - ./benchmark/fixtures/synthetic:/app/benchmark/fixtures/synthetic:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        RAGSCOPE_INSTALL_RERANKER: ${RAGSCOPE_INSTALL_RERANKER:-false}
    command: ["python", "-m", "backend.app.jobs.worker"]
    environment:
      RAGSCOPE_ENVIRONMENT: ${RAGSCOPE_ENVIRONMENT:-development}
      RAGSCOPE_DATABASE_URL: ${RAGSCOPE_DATABASE_URL:-postgresql+psycopg://ragscope:ragscope@db:5432/ragscope}
      RAGSCOPE_ARTIFACT_ROOT: ${RAGSCOPE_ARTIFACT_ROOT:-/var/lib/ragscope/artifacts}
      RAGSCOPE_EMBEDDING_PROVIDER: ${RAGSCOPE_EMBEDDING_PROVIDER:-fake}
      RAGSCOPE_EMBEDDING_MODEL: ${RAGSCOPE_EMBEDDING_MODEL:-fake-hash-embedding-v1}
      RAGSCOPE_EMBEDDING_DIMENSION: ${RAGSCOPE_EMBEDDING_DIMENSION:-64}
      RAGSCOPE_GENERATION_PROVIDER: ${RAGSCOPE_GENERATION_PROVIDER:-fake}
      RAGSCOPE_GENERATION_MODEL: ${RAGSCOPE_GENERATION_MODEL:-fake-generation-v1}
      RAGSCOPE_GENERATION_INPUT_PRICE_PER_MILLION: ${RAGSCOPE_GENERATION_INPUT_PRICE_PER_MILLION:-}
      RAGSCOPE_GENERATION_OUTPUT_PRICE_PER_MILLION: ${RAGSCOPE_GENERATION_OUTPUT_PRICE_PER_MILLION:-}
      RAGSCOPE_EMBEDDING_INPUT_PRICE_PER_MILLION: ${RAGSCOPE_EMBEDDING_INPUT_PRICE_PER_MILLION:-}
      RAGSCOPE_EXPERIMENT_COST_LIMIT: ${RAGSCOPE_EXPERIMENT_COST_LIMIT:-}
      RAGSCOPE_GEMINI_API_KEY: ${RAGSCOPE_GEMINI_API_KEY:-}
      RAGSCOPE_GEMINI_BASE_URL: ${RAGSCOPE_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      RAGSCOPE_GEMINI_MODEL: ${RAGSCOPE_GEMINI_MODEL:-gemini-2.5-flash}
      RAGSCOPE_GEMINI_EMBEDDING_MODEL: ${RAGSCOPE_GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      RAGSCOPE_GEMINI_EMBEDDING_DIMENSION: ${RAGSCOPE_GEMINI_EMBEDDING_DIMENSION:-768}
      RAGSCOPE_GEMINI_EMBEDDING_BATCH_SIZE: ${RAGSCOPE_GEMINI_EMBEDDING_BATCH_SIZE:-100}
      RAGSCOPE_GEMINI_EMBEDDING_TASK_TYPE: ${RAGSCOPE_GEMINI_EMBEDDING_TASK_TYPE:-SEMANTIC_SIMILARITY}
      RAGSCOPE_WORKER_LEASE_SECONDS: ${RAGSCOPE_WORKER_LEASE_SECONDS:-600}
    volumes:
      - artifact-data:/var/lib/ragscope/artifacts
      - ./benchmark/fixtures/synthetic:/app/benchmark/fixtures/synthetic:ro
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  artifact-data:
