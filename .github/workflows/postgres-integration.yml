name: RAGScope engineering and research validity

on:
  push:
  pull_request:

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ragscope_test
          POSTGRES_USER: ragscope
          POSTGRES_PASSWORD: ragscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragscope -d ragscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RAGSCOPE_DATABASE_URL: postgresql+psycopg://ragscope:ragscope@localhost:5432/ragscope_test
      RAGSCOPE_POSTGRES_TEST_URL: postgresql+psycopg://ragscope:ragscope@localhost:5432/ragscope_test
      RAGSCOPE_ARTIFACT_ROOT: ${{ runner.temp }}/ragscope-artifacts
      RAGSCOPE_JOB_API_DEFAULT_WAIT: "true"
      RAGSCOPE_CORS_ORIGINS: http://127.0.0.1:3100,http://localhost:3100
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      PLAYWRIGHT_API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: python -m alembic upgrade head
      - run: python -m alembic current
      - run: python -m alembic check
      - run: python -m ruff check backend
      - run: python -m mypy
      - run: python -m pytest -p no:cacheprovider -q
      - run: python -m backend.app.fixture_workflow
      - run: python -m backend.app.fixture_workflow
      - run: python -m backend.app.maintenance scan-research-artifacts
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start fake-provider API and frontend
        shell: bash
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/ragscope-api.log" 2>&1 &
          (cd frontend && npm run dev -- --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/ragscope-web.log" 2>&1) &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null && curl --fail --silent http://127.0.0.1:3100 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ragscope-api.log"
          cat "$RUNNER_TEMP/ragscope-web.log"
          exit 1
      - working-directory: frontend
        run: npm run e2e
